<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>عرض التقرير التفاعلي &mdash; PSYCHO 404</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101827;
      color: #f4f6fa;
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
    }
    
    /* Top Toolbar */
    .reader-header {
      height: 54px;
      background: rgba(16, 24, 39, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(40, 123, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 100;
      position: relative;
    }
    
    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(40, 123, 255, 0.12);
      color: #65d9ff;
      border: 1px solid rgba(40, 123, 255, 0.35);
      border-radius: 8px;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-back:hover {
      background: rgba(40, 123, 255, 0.25);
      color: #ffffff;
      transform: translateX(2px);
    }

    .report-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #f4f6fa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 50vw;
    }

    .btn-icon {
      background: rgba(27, 41, 64, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-icon:hover {
      background: rgba(40, 123, 255, 0.18);
      color: #ffffff;
    }

    /* Viewer Container */
    .viewer-container {
      width: 100%;
      height: calc(100% - 54px);
      position: relative;
      background: #f8fafc;
    }

    #reportFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: #101827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(40, 123, 255, 0.2);
      border-top-color: #287bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* Error Message */
    .error-box {
      display: none;
      max-width: 450px;
      padding: 1.5rem;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      text-align: center;
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="reader-header">
    <div class="header-left">
      <a href="index.html#categories" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
        <span>العودة إلى PSYCHO 404</span>
      </a>
      <h1 class="report-title" id="displayReportTitle">تقرير المحاضرة التفاعلي</h1>
    </div>

    <div class="header-right">
      <button class="btn-icon" id="btnToggleFullscreen" title="ملء الشاشة">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <span>ملء الشاشة</span>
      </button>
    </div>
  </header>

  <!-- Viewer Iframe and Loading Area -->
  <main class="viewer-container">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner" id="loadingSpinner"></div>
      <p class="loading-text" id="loadingStatusText">جاري تحميل المحاضرة التفاعلية...</p>
      <div class="error-box" id="errorBox">
        <h3 style="color:#f87171;margin-bottom:0.5rem;font-size:1.05rem;">تعذر تحميل التقرير</h3>
        <p id="errorText" style="color:#cbd5e1;font-size:0.88rem;line-height:1.6;">تأكد من اتصال الإنترنت أو صحة الرابط.</p>
        <div id="errorDetails" style="display:none;margin-top:0.75rem;padding:0.6rem;background:rgba(0,0,0,0.3);border-radius:6px;font-family:monospace;font-size:0.75rem;color:#94a3b8;word-break:break-all;text-align:left;direction:ltr;"></div>
        <div style="display:flex;gap:0.5rem;justify-content:center;flex-wrap:wrap;margin-top:1.25rem;">
          <button class="btn-back" type="button" onclick="window.location.reload()">🔄 إعادة المحاولة</button>
          <a id="btnDirectOpen" href="#" target="_blank" rel="noopener noreferrer" class="btn-back" style="display:none;">🔗 فتح الملف الأصلي</a>
          <a href="index.html" class="btn-back" style="background:rgba(255,255,255,0.08);color:#e2e8f0;border-color:rgba(255,255,255,0.2);">🏠 الموقع الرئيسي</a>
        </div>
      </div>
    </div>

    <iframe id="reportFrame" title="Interactive Report Viewer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      let src = params.get('src') || '';
      const title = params.get('title') || 'تقرير المحاضرة التفاعلي';

      const titleElem = document.getElementById('displayReportTitle');
      const frame = document.getElementById('reportFrame');
      const overlay = document.getElementById('loadingOverlay');
      const spinner = document.getElementById('loadingSpinner');
      const statusText = document.getElementById('loadingStatusText');
      const errorBox = document.getElementById('errorBox');
      const errorText = document.getElementById('errorText');
      const errorDetails = document.getElementById('errorDetails');
      const btnDirectOpen = document.getElementById('btnDirectOpen');
      const btnFullscreen = document.getElementById('btnToggleFullscreen');

      if (titleElem) titleElem.textContent = title;
      document.title = title + ' — PSYCHO 404';

      if (!src) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorBox.style.display = 'block';
        errorText.textContent = 'لم يتم تحديد رابط للمحاضرة. يرجى اختيار محاضرة من الموقع الرئيسي.';
        return;
      }

      // Automatically un-nest if an existing reader URL was passed into the src parameter
      if (src.includes('reader.html') && src.includes('src=')) {
        try {
          const innerUrl = new URL(src, window.location.href);
          const innerSrc = innerUrl.searchParams.get('src');
          if (innerSrc) {
            src = innerSrc;
          }
        } catch (e) {
          const match = src.match(/[?&]src=([^&]+)/);
          if (match && match[1]) {
            src = decodeURIComponent(match[1]);
          }
        }
      }

      // Repair localhost URLs if opened on a mobile device or other host
      if (src.includes('localhost:3000') && !window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1')) {
        src = src.replace('http://localhost:3000', 'https://yazeedhaniiiiii.github.io/psycho-404');
      }

      // Enable direct open button if student needs raw fallback
      if (btnDirectOpen) {
        btnDirectOpen.href = src;
        btnDirectOpen.style.display = 'inline-flex';
      }

      // Build prioritized list of candidate URLs to fetch
      const candidates = [];

      if (src.startsWith('http://') || src.startsWith('https://')) {
        candidates.push(src);
        if (src.includes('yazeedhaniiiiii.github.io/psycho-404/')) {
          const rel = src.split('yazeedhaniiiiii.github.io/psycho-404/')[1];
          if (rel) {
            candidates.push(rel.replace(/^\.?\//, ''));
            candidates.push('assets/' + rel.replace(/^\.?\//, ''));
          }
        }
      } else {
        const clean = src.replace(/^\.?\//, '');
        candidates.push(clean);
        if (!clean.startsWith('assets/')) {
          candidates.push('assets/' + clean);
        }
        candidates.push(`https://yazeedhaniiiiii.github.io/psycho-404/${clean}`);
      }

      // If Lecture 01, add dedicated cloud fallbacks
      if (src.includes('01') || src.toLowerCase().includes('biological')) {
        candidates.push('https://dniewruwrswlgbatvnfk.supabase.co/storage/v1/object/public/lecture-reports/01/biological-bases-of-behaviour.html');
        candidates.push('https://dniewruwrswlgbatvnfk.supabase.co/functions/v1/serve-report?lecture=1');
      }

      // Deduplicate candidates
      const uniqueCandidates = Array.from(new Set(candidates));

      // Sequential fetch with multi-source fallback
      async function fetchHtmlWithFallback(urls) {
        let lastError = null;
        for (const url of urls) {
          try {
            const res = await fetch(url);
            if (res.ok) {
              return await res.text();
            }
            lastError = new Error(`HTTP ${res.status} (${res.statusText}) from ${url}`);
          } catch (err) {
            lastError = err;
          }
        }
        throw lastError || new Error('All candidate URLs failed to load');
      }

      function renderHtml(htmlContent) {
        let rendered = false;

        // Method 1: srcdoc (Best compatibility with sandboxed iframes on Safari/Chrome/Firefox)
        try {
          frame.srcdoc = htmlContent;
          rendered = true;
        } catch (e1) {
          console.warn('srcdoc failed, attempting Blob URL:', e1);
        }

        // Method 2: Blob URL
        if (!rendered) {
          try {
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            frame.src = URL.createObjectURL(blob);
            rendered = true;
          } catch (e2) {
            console.warn('Blob URL failed, attempting contentDocument.write:', e2);
          }
        }

        // Method 3: contentDocument.write
        if (!rendered) {
          try {
            const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
            if (doc) {
              doc.open();
              doc.write(htmlContent);
              doc.close();
              rendered = true;
            }
          } catch (e3) {
            console.error('All iframe rendering methods failed:', e3);
          }
        }

        // Smoothly hide loading overlay on frame load
        frame.onload = () => {
          overlay.style.opacity = '0';
          setTimeout(() => { overlay.style.display = 'none'; }, 300);
        };

        // Fallback timer: ensure overlay disappears after 900ms even if iframe load event is suppressed
        setTimeout(() => {
          overlay.style.opacity = '0';
          setTimeout(() => { overlay.style.display = 'none'; }, 300);
        }, 900);
      }

      // Execute fetch
      fetchHtmlWithFallback(uniqueCandidates)
        .then((html) => {
          renderHtml(html);
        })
        .catch((err) => {
          console.error('Reader load failed:', err);
          spinner.style.display = 'none';
          statusText.style.display = 'none';
          errorBox.style.display = 'block';
          errorText.textContent = 'تعذر تحميل المحاضرة التفاعلية. يمكنك فتح الملف الأصلي مباشرة أو إعادة المحاولة.';
          if (errorDetails) {
            errorDetails.style.display = 'block';
            errorDetails.textContent = `Error: ${err?.message || err}\nRequested src: ${src}\nHost: ${window.location.host}`;
          }
        });

      // Fullscreen Toggle
      if (btnFullscreen) {
        btnFullscreen.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        });
      }
    })();
  </script>
</body>
</html>
