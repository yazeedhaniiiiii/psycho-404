<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login &mdash; PSYCHO 404</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Admin Stylesheet -->
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page-wrapper">

  <!-- Background Ambience -->
  <div class="login-glow-orb"></div>

  <!-- Login Card -->
  <div class="login-card">
    
    <div class="login-header">
      <div class="login-brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div>
        <h1 class="login-title">PSYCHO 404</h1>
        <p class="login-subtitle">Single Admin Control Center</p>
      </div>
    </div>

    <!-- Login Form -->
    <form class="login-form" id="adminLoginForm">
      
      <div class="form-group">
        <label for="adminEmail" class="form-label">Admin Email</label>
        <div class="input-with-icon">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
          </span>
          <input type="email" id="adminEmail" class="form-control" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <div class="form-label">
          <span>Password</span>
          <span style="font-size:0.75rem; color:var(--text-muted);">Administrator account</span>
        </div>
        <div class="input-with-icon">
          <span class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="adminPassword" class="form-control" required autocomplete="current-password">
          <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div style="text-align:right;margin-top:-0.35rem;margin-bottom:0.75rem;">
        <button type="button" id="forgotPasswordBtn" style="padding:0;border:0;background:none;color:#7dd3fc;font:inherit;font-size:0.82rem;cursor:pointer;">
          Forgot password?
        </button>
      </div>

      <button type="submit" class="btn btn-primary" id="btnSubmitLogin" style="width:100%; padding: 0.8rem; font-size:0.95rem;">
        <span>Access Dashboard</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <div class="login-hint-box" id="loginMessage" aria-live="polite">
        Sign in with an authorized PSYCHO 404 administrator account.
      </div>

      <!-- Public Site Link -->
      <div style="text-align: center; margin-top: 0.5rem;">
        <a href="../index.html" class="btn btn-secondary btn-sm" style="width: 100%;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          <span>Return to PSYCHO 404 Live Site</span>
        </a>
      </div>

    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
  <script src="../js/supabase-client.js"></script>
  <script>
    // Password Reveal Toggle
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('adminPassword');
    const message = document.getElementById('loginMessage');
    const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
    toggleBtn.addEventListener('click', () => {
      const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
      pwdInput.setAttribute('type', type);
    });

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('btnSubmitLogin');
      submitBtn.innerHTML = `<span>Authenticating...</span>`;
      submitBtn.style.opacity = '0.7';
      submitBtn.disabled = true;
      message.textContent = '';
      let result;
      try {
        result = await window.PSYCHO404_DB.signInAdmin(
          document.getElementById('adminEmail').value.trim(),
          pwdInput.value
        );
      } catch (error) {
        result = { error: 'Could not reach Supabase. Check your connection and try again.' };
      }
      if (result.error) {
        message.textContent = result.error;
        submitBtn.innerHTML = '<span>Access Dashboard</span>';
        submitBtn.style.opacity = '1';
        submitBtn.disabled = false;
        return;
      }
      window.location.href = 'index.html';
    });

    forgotPasswordBtn.addEventListener('click', async () => {
      const email = document.getElementById('adminEmail').value.trim();
      if (!email) {
        message.textContent = 'Enter your Supabase account email first.';
        document.getElementById('adminEmail').focus();
        return;
      }
      forgotPasswordBtn.disabled = true;
      message.textContent = 'Sending password recovery link…';
      try {
        const result = await window.PSYCHO404_DB.sendPasswordRecovery(email);
        message.textContent = result.error || 'If this account exists, a password recovery link has been sent.';
      } catch (error) {
        message.textContent = 'Could not send recovery email. Please check your connection and try again.';
      } finally {
        forgotPasswordBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
