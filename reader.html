<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>عرض التقرير التفاعلي &mdash; PSYCHO 404</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101827;
      color: #f4f6fa;
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
    }
    
    /* Top Toolbar */
    .reader-header {
      height: 54px;
      background: rgba(16, 24, 39, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(40, 123, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      z-index: 100;
      position: relative;
    }
    
    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(40, 123, 255, 0.12);
      color: #65d9ff;
      border: 1px solid rgba(40, 123, 255, 0.35);
      border-radius: 8px;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .btn-back:hover {
      background: rgba(40, 123, 255, 0.25);
      color: #ffffff;
      transform: translateX(2px);
    }

    .report-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #f4f6fa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 50vw;
    }

    .btn-icon {
      background: rgba(27, 41, 64, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      border-radius: 8px;
      padding: 0.45rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-icon:hover {
      background: rgba(40, 123, 255, 0.18);
      color: #ffffff;
    }

    /* Viewer Container */
    .viewer-container {
      width: 100%;
      height: calc(100% - 54px);
      position: relative;
      background: #f8fafc;
    }

    #reportFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
    }

    /* Loading Overlay */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: #101827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(40, 123, 255, 0.2);
      border-top-color: #287bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #94a3b8;
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* Error Message */
    .error-box {
      display: none;
      max-width: 450px;
      padding: 1.5rem;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      text-align: center;
      color: #fca5a5;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="reader-header">
    <div class="header-left">
      <a href="index.html#categories" class="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
        <span>العودة إلى PSYCHO 404</span>
      </a>
      <h1 class="report-title" id="displayReportTitle">تقرير المحاضرة التفاعلي</h1>
    </div>

    <div class="header-right">
      <button class="btn-icon" id="btnToggleFullscreen" title="ملء الشاشة">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <span>ملء الشاشة</span>
      </button>
    </div>
  </header>

  <!-- Viewer Iframe and Loading Area -->
  <main class="viewer-container">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner" id="loadingSpinner"></div>
      <p class="loading-text" id="loadingStatusText">جاري تحميل المحاضرة التفاعلية...</p>
      <div class="error-box" id="errorBox">
        <p id="errorText">تعذر تحميل هذا التقرير.</p>
        <button class="btn-back" style="margin-top:1rem;display:inline-flex;" onclick="window.location.reload()">إعادة المحاولة</button>
      </div>
    </div>

    <iframe id="reportFrame" title="Interactive Report Viewer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      let src = params.get('src') || '';
      const title = params.get('title') || 'تقرير المحاضرة التفاعلي';

      const titleElem = document.getElementById('displayReportTitle');
      const frame = document.getElementById('reportFrame');
      const overlay = document.getElementById('loadingOverlay');
      const spinner = document.getElementById('loadingSpinner');
      const statusText = document.getElementById('loadingStatusText');
      const errorBox = document.getElementById('errorBox');
      const errorText = document.getElementById('errorText');
      const btnFullscreen = document.getElementById('btnToggleFullscreen');

      if (titleElem) titleElem.textContent = title;
      document.title = title + ' — PSYCHO 404';

      if (!src) {
        spinner.style.display = 'none';
        statusText.style.display = 'none';
        errorBox.style.display = 'block';
        errorText.textContent = 'لم يتم تحديد رابط للمحاضرة. يرجى اختيار محاضرة من الموقع الرئيسي.';
        return;
      }

      // If it's a relative path to reports/
      if (src.startsWith('reports/') || (!src.startsWith('http://') && !src.startsWith('https://') && !src.startsWith('/'))) {
        src = src.replace(/^\.\.\//, '');
      }

      // Fetch HTML text and inject as Blob URL to guarantee text/html execution in all browsers
      fetch(src)
        .then((response) => {
          if (!response.ok) throw new Error('HTTP ' + response.status + ' - ' + response.statusText);
          return response.text();
        })
        .then((htmlContent) => {
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          const blobUrl = URL.createObjectURL(blob);
          frame.src = blobUrl;
          frame.onload = () => {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
          };
        })
        .catch((err) => {
          console.error('Reader load failed:', err);
          spinner.style.display = 'none';
          statusText.style.display = 'none';
          errorBox.style.display = 'block';
          errorText.textContent = 'تعذر تحميل التقرير. تأكد من اتصال الإنترنت أو صحة الرابط المرفوع.';
        });

      // Fullscreen Toggle
      if (btnFullscreen) {
        btnFullscreen.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        });
      }
    })();
  </script>
</body>
</html>
